<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BORIS721 | System Interface</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- CORE VARIABLES (Cyber-Sentience Palette) --- */
        :root {
            --bg-color: #050A14;
            --primary: #00F0FF;
            --secondary: #008C9E;
            --accent: #FF0055;
            --text: #E0E6ED;
            --glass: rgba(0, 0, 0, 0.4);
            --border-opacity: rgba(0, 140, 158, 0.3);
        }

        /* --- RESET & BASE --- */
        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        ::selection { background: var(--primary); color: #000; }

        /* --- UTILITY CLASSES --- */
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .gap-6 { gap: 1.5rem; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
        .w-full { width: 100%; }
        .max-w-4xl { max-width: 56rem; }
        .max-w-2xl { max-width: 42rem; }
        .max-w-lg { max-width: 32rem; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .fixed { position: fixed; }
        .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
        .z-0 { z-index: 0; }
        .z-10 { z-index: 10; }
        .z-20 { z-index: 20; }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .text-xs { font-size: 0.75rem; }
        .text-sm { font-size: 0.875rem; }
        .text-base { font-size: 1rem; }
        .font-bold { font-weight: bold; }
        .uppercase { text-transform: uppercase; }
        .italic { font-style: italic; }
        .opacity-50 { opacity: 0.5; }
        .opacity-60 { opacity: 0.6; }
        .opacity-70 { opacity: 0.7; }
        .opacity-80 { opacity: 0.8; }
        .opacity-100 { opacity: 1; }
        .text-primary { color: var(--primary); }
        .text-secondary { color: var(--secondary); }
        .text-accent { color: var(--accent); }
        .text-white { color: #fff; }
        .text-gray { color: #9ca3af; }
        .hover-text-white:hover { color: #fff; }
        .hover-bg-primary-low:hover { background-color: rgba(0, 240, 255, 0.05); }
        .transition { transition: all 0.3s ease; }
        .cursor-pointer { cursor: pointer; }
        .select-none { user-select: none; }
        .border { border: 1px solid var(--secondary); }
        .border-opacity { border-color: var(--border-opacity); }
        .border-b { border-bottom: 1px solid var(--secondary); }
        .border-t { border-top: 1px solid var(--border-opacity); }
        .border-l { border-left: 1px solid var(--border-opacity); }
        .rounded { border-radius: 0.25rem; }
        .rounded-full { border-radius: 9999px; }

        /* --- SPECIFIC COMPONENTS --- */
        /* Background Grid */
        .bg-grid {
            background-image: linear-gradient(var(--secondary) 1px, transparent 1px), linear-gradient(90deg, var(--secondary) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.1;
            mask-image: radial-gradient(circle, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle, black 40%, transparent 80%);
        }

        /* Main Container */
        .main-container {
            padding: 1.5rem;
            justify-content: center;
        }

        /* Header */
        .hud-header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom-color: var(--secondary);
        }

        .status-dot {
            width: 0.75rem;
            height: 0.75rem;
            background-color: #00FF00;
            /* Green */
            border-radius: 50%;
            box-shadow: 0 0 5px #00FF00;
        }

        .status-dot-red {
            width: 0.75rem;
            height: 0.75rem;
            background-color: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* Logo Section */
        .logo-wrapper {
            width: 12rem;
            height: 12rem;
            border: 2px solid var(--secondary);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            transition: transform 0.5s;
            overflow: hidden;
        }

        .logo-wrapper:hover { transform: scale(1.05); }

        @media (min-width: 768px) {
            .logo-wrapper {
                width: 16rem;
                height: 16rem;
            }
        }

        .logo-ring {
            margin: -1rem;
            border: 1px dashed var(--primary);
            opacity: 0.3;
            animation: spin-slow 10s linear infinite;
        }

        .logo-glow {
            background-color: var(--primary);
            filter: blur(40px);
            opacity: 0.2;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: pulse-glow 4s ease-in-out infinite;
            filter: contrast(1.2) brightness(1.1);
        }

        /* Typography */
        .main-title {
            font-size: 3rem;
            line-height: 1;
            letter-spacing: -0.05em;
            margin-bottom: 0.5rem;
        }

        @media (min-width: 768px) {
            .main-title {
                font-size: 4.5rem;
            }
        }

        .version-tag {
            top: -1rem;
            right: -2rem;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            display: none;
        }

        @media (min-width: 768px) {
            .version-tag {
                display: inline-block;
            }
        }

        /* Tabs */
        .tab-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--secondary);
            color: var(--text);
            background: transparent;
            font-family: inherit;
            font-size: 0.875rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .tab-btn:hover { border-color: var(--primary); }

        .tab-btn.active {
            background-color: rgba(0, 240, 255, 0.1);
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        /* Content Area Wrapper (Fixed Frame) */
        .content-wrapper {
            background-color: var(--glass);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border-opacity);
            border-radius: 0.25rem;
            position: relative;
            /* Anchor for corners */
            overflow: hidden;
            /* Contains the scrollable child */
            margin-top: 2rem;
            /* Espacement Avant */
            margin-bottom: 2rem;
            /* Espacement Après */
        }

        /* Scrollable Content Area */
        .content-scroll {
            max-height: 400px;
            overflow-y: auto;
            padding: 1.5rem;
        }

        /* Scrollbar */
        .content-scroll::-webkit-scrollbar {
            width: 8px;
        }

        .content-scroll::-webkit-scrollbar-track {
            background: #0b1629;
        }

        .content-scroll::-webkit-scrollbar-thumb {
            background: var(--secondary);
            border-radius: 4px;
        }

        .content-scroll::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* Corner Accents */
        .corner {
            width: 1rem;
            height: 1rem;
            position: absolute;
            border-color: var(--primary);
            border-style: solid;
            pointer-events: none;
            z-index: 20;
            /* Ensure on top of content/scroll */
        }

        .tl { top: 0; left: 0; border-width: 2px 0 0 2px; }
        .tr { top: 0; right: 0; border-width: 2px 2px 0 0; }
        .bl { bottom: 0; left: 0; border-width: 0 0 2px 2px; }
        .br { bottom: 0; right: 0; border-width: 0 2px 2px 0; }

        /* Timeline Specifics */
        .timeline-container {
            padding-left: 1rem;
            border-left: 1px solid var(--border-opacity);
        }

        .timeline-dot-marker {
            width: 0.75rem;
            height: 0.75rem;
            border-radius: 50%;
            position: absolute;
            left: -1.35rem;
            /* Adjust based on padding/border */
            top: 0.25rem;
            box-shadow: 0 0 8px currentColor;
        }

        /* Info Cards */
        .info-card {
            background-color: #050A14;
            padding: 0.75rem;
            border-radius: 0.25rem;
            border: 1px solid rgba(0, 140, 158, 0.2);
        }

        /* Animations */
        @keyframes scan {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(100%); opacity: 0; }
        }

        @keyframes pulse-glow {
            0% { filter: drop-shadow(0 0 2px rgba(0, 240, 255, 0.3)); opacity: 0.9; }
            50% { filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.8)); opacity: 1; }
            100% { filter: drop-shadow(0 0 2px rgba(0, 240, 255, 0.3)); opacity: 0.9; }
        }

        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .scanline {
            background: linear-gradient(to bottom, transparent, rgba(0, 240, 255, 0.3), transparent);
            animation: scan 3s linear infinite;
            pointer-events: none;
        }

        .animate-blink {
            animation: blink 1s step-end infinite;
        }

        .animate-fadeIn {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body>
    <!-- Background Grid -->
    <div class="fixed inset-0 bg-grid z-0"></div>

    <!-- Main Container -->
    <main class="main-container z-10 w-full max-w-4xl flex flex-col items-center relative min-h-screen">

            <div class="corner bl"></div>

            <!-- Scrollable Inner Area -->
            <div id="content-display" class="content-scroll">

                <div id="inner-content" class="animate-fadeIn">

        </div>

        <!-- Social/Footer -->
        <div class="mt-8 flex flex-col items-center gap-4 opacity-60 hover:opacity-100 transition">
            <div class="flex gap-6">

            </div> `,

                        models: ` <div class="flex flex-col gap-4">

        // --- TYPEWRITER EFFECT ---
        // Updated text for typewriter
        const typeText = "INITIALIZING... OPENCLAW 2026.1.30... READY.";
        const typeElement = document.getElementById('typewriter');
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < typeText.length) {
                typeElement.innerHTML += typeText.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 40);
            }
        }

        // --- TAB LOGIC ---
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`btn-${tabName}`).classList.add('active');

            const contentDiv = document.getElementById('inner-content');
            contentDiv.style.opacity = '0';
            contentDiv.style.transform = 'translateY(10px)';
            setTimeout(() => {
                contentDiv.innerHTML = borisData[tabName];
                contentDiv.style.opacity = '1';
                contentDiv.style.transform = 'translateY(0)';
            }, 200);
        }

        // --- INITIALIZATION ---
        window.onload = function() {

            document.getElementById('inner-content').innerHTML = borisData.status;

        function triggerScan() {

</body>
</html>
