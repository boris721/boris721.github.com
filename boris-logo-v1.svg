<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#162745"/>
  
  <!-- Futuristic Cat Shape -->
  <g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <path d="M120 180 Q100 120 160 100 Q200 80 240 100 Q300 120 280 180" stroke="#72cbc3"/>
    <path d="M140 170 Q130 140 170 130 Q200 120 230 130 Q270 140 260 170" stroke="#548b93"/>
    <path d="M160 160 Q200 150 240 160" stroke="#4f8c9c"/>
    
    <!-- Ears -->
    <path d="M130 130 L110 80 L160 110" stroke="#72cbc3"/>
    <path d="M270 110 L320 80 L290 130" stroke="#72cbc3"/>
    
    <!-- Eyes -->
    <circle cx="175" cy="140" r="12" fill="#162745"/>
    <circle cx="225" cy="140" r="12" fill="#162745"/>
    <circle cx="178" cy="138" r="5" fill="#72cbc3"/>
    <circle cx="228" cy="138" r="5" fill="#72cbc3"/>
    
    <!-- Body -->
    <path d="M150 220 Q140 280 160 320 Q200 360 240 320 Q260 280 250 220" stroke="#548b93"/>
    
    <!-- Arms -->
    <path d="M140 240 Q100 260 80 300" stroke="#72cbc3"/>
    <path d="M260 240 Q300 260 320 300" stroke="#72cbc3"/>
    
    <!-- Tail -->
    <path d="M250 330 Q290 350 300 390" stroke="#4f8c9c"/>
  </g>
  
  <!-- Tech Elements -->
  <circle cx="200" cy="200" r="150" stroke="#72cbc3" stroke-width="2" fill="none" opacity="0.3"/>
  <circle cx="200" cy="200" r="120" stroke="#548b93" stroke-width="1" fill="none" opacity="0.2"/>
</svg>
